name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  case-api:
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL 16 for the tests, same version as local development.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: case-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/caseguard_test
        run: mvn -B verify
