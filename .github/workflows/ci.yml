name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  case-api:
    runs-on: ubuntu-latest
    # Real PostgreSQL 16 and real Kafka 4.3 (KRaft, single node).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    defaults:
      run:
        working-directory: case-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Download dependencies (retried, see scripts/ci-build-jars.sh)
        run: |
          for i in 1 2 3 4; do ./mvnw -B -q -U dependency:go-offline && exit 0; sleep $((i * 20)); done; exit 1
      - name: Build and test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/caseguard_test
        run: ./mvnw -B verify

  escalation-worker:
    runs-on: ubuntu-latest
    # Real PostgreSQL 16 and real Kafka 4.3 (KRaft, single node).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    defaults:
      run:
        working-directory: escalation-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Download dependencies (retried, see scripts/ci-build-jars.sh)
        run: |
          for i in 1 2 3 4; do ./mvnw -B -q -U dependency:go-offline && exit 0; sleep $((i * 20)); done; exit 1
      - name: Build and test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/caseguard_test
        run: ./mvnw -B verify

  crash-demo:
    # The REAL crash-and-replay demo, both scenarios, on every push.
    runs-on: ubuntu-latest
    # Real PostgreSQL 16 and real Kafka 4.3 (KRaft, single node).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build jars
        run: scripts/ci-build-jars.sh
      - name: Worker crashes after DB commit, before Kafka ack
        run: scripts/demo-crash-replay.sh worker
      - name: Relay crashes after publish, before marking outbox row
        run: scripts/demo-crash-replay.sh relay

  agent:
    # Fast agent tests against the fake Case API (no services).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Agent evaluation (105 labelled conversations, deterministic brains)
        run: |
          python -m caseguard_agent.evaluation --trials 1 --report eval-report.md
          python -m caseguard_agent.evaluation.judge > judge.md
          { echo "## Agent evaluation"; cat eval-report.md; echo; echo "## Judge calibration (baseline)"; cat judge.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Retrieval eval with a semantic embedding model (measurement, not a gate)
        continue-on-error: true        # the model download may be unavailable; the numbers are informational
        run: |
          pip install -e ".[semantic]"
          python -m caseguard_agent.retrieval_eval --embedder fastembed | tee retrieval-eval.md
          { echo "## Policy retrieval eval"; cat retrieval-eval.md; } >> "$GITHUB_STEP_SUMMARY"

  agent-e2e:
    # The agent against the REAL Case API, Kafka and worker.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/pyproject.toml }
      - name: Install agent
        run: pip install -e "agent[dev]"
      - name: Build jars
        run: scripts/ci-build-jars.sh
      - name: End-to-end tests
        env:
          PYTHON: python
        run: scripts/e2e-agent.sh
      - name: Durable conversations and pgvector retrieval (real PostgreSQL)
        env:
          CASEGUARD_TEST_PG: postgresql://caseguard:caseguard@localhost:5432/caseguard_test
        run: python -m pytest -q agent/tests/test_durable_checkpoints.py agent/tests/test_retrieval.py

  harness:
    # The regression harness: every scenario file against the REAL stack, with fault injection.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/pyproject.toml" }
      - name: Install agent and harness
        run: pip install -e "agent[tracing]" -e "harness[dev]"
      - name: Checker and fault-proxy unit tests
        run: python -m pytest -q harness/tests
      - name: Build jars
        run: scripts/ci-build-jars.sh
      - name: Fetch the OpenTelemetry Java agent
        run: scripts/fetch-otel-agent.sh
      - name: Run all scenarios (with tracing, so S26 checks one trace across all services)
        run: python -m caseguard_harness --tracing --report harness-report.md
      - name: Publish report
        if: always()
        run: '[ -f harness-report.md ] && cat harness-report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: |
            harness-report.md
            harness-report.json

  load-test:
    # Gates on the INVARIANTS under load (one escalation, event and task per case; no duplicates from
    # same-key retries). Latency is reported, not gated: shared CI runners are too noisy for that.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: caseguard
          POSTGRES_PASSWORD: caseguard
          POSTGRES_DB: caseguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/pyproject.toml" }
      - run: pip install -e agent -e "harness[dev]"
      - run: scripts/ci-build-jars.sh
      - name: Load test (1,000 escalations, 20% same-key retries)
        run: |
          python -m caseguard_harness.loadtest --escalations 1000 --concurrency 40 --report load-report.md
      - name: Publish report
        if: always()
        run: '[ -f load-report.md ] && cat load-report.md >> "$GITHUB_STEP_SUMMARY" || true'

  docker-compose:
    # Builds both images and runs the full stack: request → relay → Kafka → worker → task.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait postgres kafka jaeger case-api agent
      - name: Start the worker
        run: docker compose up -d escalation-worker
      - name: End-to-end smoke test
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8081/actuator/health && break; sleep 2; done
          curl -sf -X POST localhost:8081/cases/C-1042/escalations \
            -H "X-Tenant-Id: acme" -H "X-Customer-Id: cust-A1" -H "Content-Type: application/json" \
            -H "Idempotency-Key: $(cat /proc/sys/kernel/random/uuid)" \
            -d '{"reason":"Order is 8 business days late","policyRef":"ESC-3@v2"}'
          for i in $(seq 1 60); do
            n=$(docker compose exec -T postgres psql -U caseguard -d caseguard -tAc "select count(*) from follow_up_tasks")
            [ "$n" = "1" ] && echo "follow-up task created" && exit 0
            sleep 2
          done
          docker compose logs case-api escalation-worker | tail -50
          exit 1
      - name: Chat with the agent container
        run: |
          for i in $(seq 1 30); do
            curl -sf -X POST localhost:8090/chat -H "Content-Type: application/json" \
              -d '{"session":"demo-asha","message":"Order 1043 is late, can you escalate?"}' > reply.json && break
            sleep 2
          done
          cat reply.json
          grep -q escalation_declined reply.json
      - name: Approval flow through the agent container (customer → supervisor → resumed reply)
        run: |
          curl -sf -X POST localhost:8090/chat -H "Content-Type: application/json" \
            -d '{"session":"demo-asha","conversation_id":"ci-approval","message":"Order 1099 is late, please escalate it."}' \
            | tee step1.json
          grep -q approval_requested step1.json
          APPROVAL=$(python3 -c "import json;print(json.load(open('step1.json'))['waiting_for_approval'])")
          curl -sf -X POST localhost:8090/supervisor/decide \
            -d "as=sup-maria&approval_id=$APPROVAL&decision=APPROVED" | tee step2.html
          grep -qi "escalat" step2.html
          curl -sf localhost:8090/conversations/ci-approval | tee step3.json
          python3 -c "import json;d=json.load(open('step3.json'));assert d['waiting_for_approval'] is None;assert len(d['messages'])==3"
      - name: Jaeger received ONE trace spanning agent, Case API and worker
        run: |
          check() {
            python3 - <<'PY'
          # Jaeger 2.x serves API v3 (/api/v3/...: OTLP JSON); older versions serve /api/... . Try both.
          import json, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          BASE = "http://localhost:16686"
          WANT = {"caseguard-agent", "case-api", "escalation-worker"}

          def get(path):
              try:
                  with urllib.request.urlopen(BASE + path, timeout=5) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return str(e), ""

          def docs(text):              # a JSON document, or newline-delimited JSON (streamed results)
              try:
                  return [json.loads(text)]
              except ValueError:
                  return [json.loads(l) for l in text.splitlines() if l.strip()]

          def walk(o, key):            # every value stored under `key`, at any depth
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k == key:
                          yield v
                      yield from walk(v, key)
              elif isinstance(o, list):
                  for v in o:
                      yield from walk(v, key)

          now = datetime.now(timezone.utc)
          fmt = lambda t: t.strftime("%Y-%m-%dT%H:%M:%SZ")
          status, body = get("/api/v3/services")
          print("GET /api/v3/services ->", status, body[:200])
          q = (f"/api/v3/traces?query.service_name=caseguard-agent&query.search_depth=100"
               f"&query.start_time_min={fmt(now - timedelta(hours=1))}&query.start_time_max={fmt(now + timedelta(minutes=5))}")
          status, body = get(q)
          services_by_trace = {}
          if status == 200 and body:
              for d in docs(body):
                  for rs_list in walk(d, "resourceSpans"):
                      for rs in rs_list:
                          svc = next((a["value"].get("stringValue") for a in rs.get("resource", {}).get("attributes", [])
                                      if a.get("key") == "service.name"), "?")
                          for spans in walk(rs, "spans"):
                              for sp in spans:
                                  services_by_trace.setdefault(sp.get("traceId"), set()).add(svc)
          else:                        # older Jaeger: legacy JSON API
              status, body = get("/api/traces?service=caseguard-agent&limit=50")
              for t in (json.loads(body).get("data") or [] if status == 200 else []):
                  services_by_trace[t["traceID"]] = {p["serviceName"] for p in t["processes"].values()}
          best = max(services_by_trace.values(), key=len, default=set())
          print("GET traces ->", status, f"{len(services_by_trace)} traces; most connected:", sorted(best))
          if not services_by_trace:
              print("raw response start:", body[:300])
          sys.exit(0 if WANT <= best else 1)
          PY
          }
          for i in $(seq 1 20); do check && exit 0; sleep 3; done
          echo "---- diagnostics ----"
          docker compose ps
          docker compose logs --tail=30 jaeger
          docker compose logs --tail=30 agent
          exit 1
