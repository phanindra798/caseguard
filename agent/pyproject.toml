[project]
name = "caseguard-agent"
version = "0.1.0"
description = "CaseGuard support agent: plans with an LLM, acts through a verified, idempotent Case API"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "fastapi>=0.120",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Live LLM mode. Install `langchain` plus the integration package for the provider you choose,
# then set CASEGUARD_LLM=live and CASEGUARD_MODEL=<provider>:<model>. No provider is hardcoded.
live = ["langchain>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs the real Case API + worker running (set CASEGUARD_E2E=1)"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caseguard_agent*"]
