spring:
  application:
    name: case-api
  datasource:
    # Defaults are for local development; Docker Compose and CI override them with env vars.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caseguard}
    username: ${DB_USER:caseguard}
    password: ${DB_PASSWORD:caseguard}
  flyway:
    # db/seed holds demo data. A production deployment would set only classpath:db/migration.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
  jpa:
    # Flyway owns the schema. Hibernate only CHECKS that entities match it, and never changes it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                      # broker confirms only after the write is durable
      properties:
        enable.idempotence: true     # producer retries don't create duplicates inside Kafka itself

caseguard:
  topics:
    escalation-requested: escalation.requested
    # Set on the topic when it is created. The worker's dedupe retention is checked against these.
    retention: P7D           # Kafka keeps a message at least this long...
    segment: P1D             # ...and at most about retention + segment (a segment is deleted whole)
  approval:
    over-cents: 50000      # orders above $500 need a supervisor's approval (per-tenant config in a real system)
    ttl-hours: 24
  relay:
    enabled: ${RELAY_ENABLED:true}
    interval-ms: 200
    batch-size: 100
  retention:
    enabled: ${RETENTION_ENABLED:true}
    interval: PT1H
    outbox-published: P7D    # published outbox rows are kept a week for debugging, then deleted
    batch-size: 1000
    max-batches-per-run: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${PORT:8081}

logging:
  level:
    org.apache.kafka: WARN
