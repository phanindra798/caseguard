# Tests use a separate database so they never touch your dev data.
# CI sets TEST_DB_URL to its own Postgres service container.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/caseguard_test}
    username: ${DB_USER:caseguard}
    password: ${DB_PASSWORD:caseguard}
  flyway:
    clean-disabled: false   # allowed ONLY in tests: we wipe and rebuild the schema per test run
