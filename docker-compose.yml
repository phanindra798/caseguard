# Local stack. Grows phase by phase (Redpanda, worker, agent, Jaeger, Toxiproxy come later).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caseguard
      POSTGRES_PASSWORD: caseguard
      POSTGRES_DB: caseguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  case-api:
    build: ./case-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/caseguard
      DB_USER: caseguard
      DB_PASSWORD: caseguard
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
