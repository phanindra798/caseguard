# Local stack. Grows phase by phase (agent, Jaeger, Toxiproxy come later).
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16      # PostgreSQL 16 + the pgvector extension
    environment:
      POSTGRES_USER: caseguard
      POSTGRES_PASSWORD: caseguard
      POSTGRES_DB: caseguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  # Official Apache Kafka image: single node in KRaft mode (no ZooKeeper).
  # Two listeners, because "localhost" means something different inside a container:
  #   localhost:9092  → for tools/tests running on your machine
  #   kafka:19092     → for the other containers (case-api, worker)
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  case-api:
    build: ./case-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/caseguard
      KAFKA_BOOTSTRAP: kafka:19092
      # Tracing: the OpenTelemetry Java agent sends spans to Jaeger.
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: case-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  escalation-worker:
    build: ./escalation-worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/caseguard
      KAFKA_BOOTSTRAP: kafka:19092
      # Tracing: the OpenTelemetry Java agent sends spans to Jaeger.
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: escalation-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
    depends_on:
      case-api: { condition: service_started }   # the Case API runs the DB migrations
      kafka: { condition: service_healthy }

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      CASE_API_URL: http://case-api:8081
      CASEGUARD_LLM: scripted          # set to "live" + CASEGUARD_MODEL to use a real model
      # Conversations live in PostgreSQL, so one paused for approval survives an agent restart.
      CASEGUARD_CHECKPOINT_DB: postgresql://caseguard:caseguard@postgres:5432/caseguard
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8090:8090"
    depends_on:
      postgres: { condition: service_healthy }
      case-api: { condition: service_started }

  # Trace viewer: http://localhost:16686 (search service "caseguard-agent").
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    environment:
      # Listen on all interfaces: other containers send spans here and the host opens the UI.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "16686:16686"     # UI and query API
      - "4318:4318"       # OTLP over HTTP (what the services send to)
