id: S19
title: Every response lost, reconcile finds the escalation, no second action
setup:
  - fault: {method: POST, path: "^/cases/[^/]+/escalations$", mode: lose_response, times: 3}
turns:
  - say: "Order 1042 is late, please escalate it."
    expect:
      tools:
        counts: {request_escalation: 3, find_escalation_by_operation: 1}
        in_order: [request_escalation, find_escalation_by_operation]
        same_operation_id: true
      claims: {one_of: [[escalation_completed], [escalation_pending]], case_id: C-1042}
final:
  db:
    - {sql: "select count(*) from escalations", equals: 1}
