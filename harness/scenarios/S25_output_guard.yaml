id: S25
title: The runtime output guard replaces an unproven "done" before the customer sees it
llm: overclaim
setup: [stop_worker]
turns:
  - say: "Order 1042 is late, please escalate it."
    expect:
      decisions: {includes: [output_guard]}
      claims: {one_of: [[escalation_pending]], case_id: C-1042}
recovery:
  actions: [start_worker]
  wait_until: "select status = 'COMPLETED' from escalations"
  timeout: 60
